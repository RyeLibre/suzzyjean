<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suzzy Jean — Prints, painting and sculpture</title>
<meta name="description" content="Suzzy Jean — prints, painting and sculpture.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --red:#c8102e; --paper:#fbf8f2; --line:#e4ded2; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"EB Garamond", Georgia, serif; font-size:19px; line-height:1.6; }
  a { color:inherit; }
  header { position:sticky; top:0; z-index:10; background:rgba(251,248,242,.95); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  .bar { max-width:1100px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .logo img { height:30px; width:auto; display:block; }
  nav a { font-family:"Amatic SC", cursive; font-size:26px; font-weight:700; text-decoration:none; margin-left:18px; }
  nav a:hover { color:var(--red); }
  main { max-width:1100px; margin:0 auto; padding:0 20px; }
  .hero { display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center; padding:60px 0 40px; }
  .hero h1 { font-family:"Amatic SC", cursive; font-size:64px; line-height:1; margin:0 0 12px; }
  .hero h1 span { color:var(--red); }
  .hero p { font-style:italic; font-size:22px; margin:0; }
  .slider { position:relative; aspect-ratio:4/5; background:transparent; overflow:hidden; }
  .slider img { position:absolute; inset:0 0 28px; width:100%; height:calc(100% - 28px); object-fit:contain; background:transparent; opacity:0; transition:opacity 1s; }
  .slider img.on { opacity:1; }
  .dots { position:absolute; bottom:4px; left:0; right:0; text-align:center; }
  .dots button { width:10px; height:10px; border-radius:50%; border:0; margin:0 4px; background:#0003; cursor:pointer; padding:0; }
  .dots button.on { background:var(--ink); }
  section { padding:50px 0; border-top:1px solid var(--line); scroll-margin-top:70px; }
  section h2 { font-family:"Amatic SC", cursive; font-size:48px; margin:0 0 20px; }
  .grid { columns:250px; column-gap:18px; }
  .grid figure { margin:0 0 18px; break-inside:avoid; background:#fff; padding:10px; box-shadow:0 2px 10px rgba(0,0,0,.08); cursor:zoom-in; }
  .grid img { width:100%; height:auto; display:block; }
  .grid figcaption { font-size:16px; padding-top:6px; }
  .empty { color:#888; font-style:italic; }
  footer { text-align:center; font-size:15px; color:#777; padding:40px 20px; border-top:1px solid var(--line); }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; align-items:center; justify-content:center; z-index:50; cursor:zoom-out; padding:20px; flex-direction:column; color:#fff; }
  #lightbox.open { display:flex; }
  #lightbox img { max-width:100%; max-height:85vh; }
  @media (max-width:760px) {
    .hero { grid-template-columns:1fr; padding-top:30px; }
    .hero h1 { font-size:48px; }
    nav a { font-size:22px; margin:0 12px 0 0; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="#top"><img src="images/logo.png" alt="Suzzy Jean"></a>
    <nav>
      <a href="#prints">Prints</a>
      <a href="#paintings">Paintings</a>
      <a href="#sculpture">Sculpture</a>
      <a href="#stories">#storieswithsuzzy</a>
      <a href="#bio">Bio</a>
    </nav>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div>
      <h1>Suzzy <span>Jean</span></h1>
      <p>Prints, painting and sculpture</p>
    </div>
    <div class="slider" id="slider">
      <img class="on" src="images/mom-back-3.jpg" alt="Artwork by Suzzy Jean" data-fallback="mom-back-3.jpg">
      <img src="images/untitled-2-1.jpg" alt="Artwork by Suzzy Jean" data-fallback="untitled-2-1.jpg">
      <img src="images/Suzzy-jean-3.jpg" alt="Artwork by Suzzy Jean" data-fallback="Suzzy-jean-3.jpg">
      <img src="images/veiled-woman-1984.jpg" alt="Self Portrait, 1984">
      <img src="images/bubble-monster.jpg" alt="Melissa and the Bubble Monster, 1987">
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <section id="prints"><h2>Prints</h2><div class="grid" data-cat="prints"></div></section>
  <section id="paintings"><h2>Paintings &amp; drawings</h2><div class="grid" data-cat="paintings"></div></section>
  <section id="sculpture"><h2>Sculpture</h2><div class="grid" data-cat="sculpture"></div></section>
  <section id="stories"><h2>#storieswithsuzzy</h2><div class="grid" data-cat="stories"></div></section>
  <section id="bio">
    <h2>Bio</h2>
    <p class="empty">Bio coming soon.</p>
  </section>
</main>

<footer>© Suzzy Jean</footer>

<div id="lightbox"><img alt=""><p></p></div>

<script>
/* ============================================================
   ADD ARTWORK HERE
   Put the image file in the /images folder, then add a line:
   { cat: "prints" | "paintings" | "sculpture" | "stories",
     file: "name.jpg", title: "Title, year, medium" },
   ============================================================ */
const WORKS = [
  { cat: "prints", file: "mom-back-3.jpg",              title: "" },
  { cat: "prints", file: "blue-face-print.jpg",         title: "" },
  { cat: "prints", file: "two-dames-in-a-dive.jpg",     title: "Two Dames in a Dive, 1988" },
  { cat: "prints", file: "three-figures-detail.jpg",    title: "" },
  { cat: "prints", file: "forest-figure-woodcut.jpg",   title: "" },
  { cat: "prints", file: "desponding-moment-ap.jpg",    title: "Desponding Moment, 1986 (artist proof)" },
  { cat: "prints", file: "desponding-moment-3-25.jpg",  title: "Desponding Moment, 1986 (3/25)" },
  { cat: "prints", file: "bubble-monster.jpg",          title: "Melissa and the Bubble Monster, 1987" },
  { cat: "prints", file: "untitled-2-1.jpg",            title: "" },
  { cat: "prints", file: "Suzzy-jean-3.jpg",            title: "" },
  { cat: "prints", file: "sunglasses-etching.jpg",      title: "" },
  { cat: "prints", file: "reclining-figure-etching.jpg",title: "" },
  { cat: "prints", file: "dresser-and-moon.jpg",        title: "" },
  { cat: "prints", file: "child-face-print.jpg",        title: "" },

  { cat: "paintings", file: "woman-with-cherubs.jpg",     title: "" },
  { cat: "paintings", file: "reaching-for-the-moon.jpg",  title: "" },
  { cat: "paintings", file: "girl-flower-crown.jpg",      title: "" },
  { cat: "paintings", file: "golden-face.jpg",            title: "" },
  { cat: "paintings", file: "veiled-woman-1984.jpg",      title: "Self Portrait, 1984" },
  { cat: "paintings", file: "faces-on-canvas.jpg",        title: "" },
  { cat: "paintings", file: "colored-pencil-portrait.jpg",title: "" },
  { cat: "paintings", file: "green-eyes.jpg",             title: "" },
  { cat: "paintings", file: "sunglasses-drawing.jpg",     title: "" },
  { cat: "paintings", file: "comic-panels.jpg",           title: "" },
];

/* If an image isn't in /images yet, load the archived copy from the Wayback Machine */
const WAYBACK = "https://web.archive.org/web/2018im_/http://www.suzzyjean.com/wp-content/uploads/2016/06/";
function fallback(img, name) {
  img.addEventListener("error", function once() {
    img.removeEventListener("error", once);
    if (name) img.src = WAYBACK + name;
  });
}
document.querySelectorAll("img[data-fallback]").forEach(i => { fallback(i, i.dataset.fallback); i.src = i.src; });

/* Galleries */
document.querySelectorAll(".grid").forEach(grid => {
  const items = WORKS.filter(w => w.cat === grid.dataset.cat);
  if (!items.length) { grid.outerHTML = '<p class="empty">Work coming soon.</p>'; return; }
  items.forEach(w => {
    const f = document.createElement("figure");
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = w.title || "Artwork by Suzzy Jean";
    fallback(img, w.file);
    img.src = "images/" + w.file;
    f.appendChild(img);
    if (w.title) { const c = document.createElement("figcaption"); c.textContent = w.title; f.appendChild(c); }
    f.onclick = () => openBox(img.src, w.title);
    grid.appendChild(f);
  });
});

/* Lightbox */
const box = document.getElementById("lightbox");
function openBox(src, cap) { box.querySelector("img").src = src; box.querySelector("p").textContent = cap || ""; box.classList.add("open"); }
box.onclick = () => box.classList.remove("open");
document.addEventListener("keydown", e => { if (e.key === "Escape") box.classList.remove("open"); });

/* Slideshow */
const slides = [...document.querySelectorAll("#slider img")];
const dots = document.getElementById("dots");
let cur = 0, timer;
slides.forEach((_, i) => { const b = document.createElement("button"); b.setAttribute("aria-label", "Slide " + (i + 1)); b.onclick = () => { show(i); restart(); }; dots.appendChild(b); });
function show(i) { slides[cur].classList.remove("on"); dots.children[cur].classList.remove("on"); cur = i; slides[cur].classList.add("on"); dots.children[cur].classList.add("on"); }
function restart() { clearInterval(timer); timer = setInterval(() => show((cur + 1) % slides.length), 3500); }
show(0); restart();
</script>
</body>
</html>
